[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "map-advisor"
version = "0.1.0"
description = "Lean hub-and-spoke multi-agent orchestrator with production safety guardrails — MAP Advisor."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Cameron Fox", email = "cameron@example.com" },
]
keywords = ["multi-agent", "orchestrator", "llm", "guardrails", "production"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
map-advisor = "map_advisor.cli:main"

[project.urls]
Homepage = "https://github.com/cameronfox/map-advisor"
Repository = "https://github.com/cameronfox/map-advisor"
"Bug Tracker" = "https://github.com/cameronfox/map-advisor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "guardrail: tests covering a specific production guardrail",
    "routing: tests covering orchestrator routing logic",
    "llm: tests covering the LLM abstraction layer",
]

[tool.coverage.run]
source = ["map_advisor"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
